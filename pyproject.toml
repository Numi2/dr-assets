[build-system]
requires = ["setuptools>=68", "toml>=0.10"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
py_version = 310

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data"]

